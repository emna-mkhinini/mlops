
# Deux services : le serveur MLflow et notre API
services:

  # ----- Service 1 : le serveur MLflow -----
  mlflow:
    # Image officielle
    image: ghcr.io/mlflow/mlflow:v3.17.1

    # Commande de démarrage du serveur
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000

    # Interface MLflow
    ports:
      - "5000:5000"

    # Volume de stockage
    volumes:
      - mlflow-data:/mlflow

  # ----- Service 2 : notre API -----
  api:
    # Construire l'image avec le Dockerfile
    build: .

    ports:
      - "8000:8000"

    # Configuration lue par app.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/churn-model@champion

    # Démarrer mlflow avant api
    depends_on:
      - mlflow

    # Relancer l'API en cas d'erreur
    restart: on-failure

# Déclaration du volume nommé
volumes:
  mlflow-data:
